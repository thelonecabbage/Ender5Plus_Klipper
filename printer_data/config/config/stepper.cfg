
[stepper_x]
# CoreXY X+Y belt uses the motor physically plugged into SKR Y (B).
step_pin: PB10
dir_pin: !PB2
enable_pin: !PB11
microsteps: 16
rotation_distance: 40
full_steps_per_rotation: 200
endstop_pin: ^!EBB:PB6
position_endstop: 377
position_max: 377
position_min: 0
homing_speed: 20 # commissioning speed until homing direction is verified

[stepper_y]
# CoreXY X-Y belt uses the motor physically plugged into SKR X (A).
step_pin: PB13
dir_pin: !PB12
enable_pin: !PB14
microsteps: 16
rotation_distance: 40
full_steps_per_rotation: 200
endstop_pin: PC1
position_endstop: 365
position_max: 365
position_min: 0
homing_speed: 20 # commissioning speed until homing direction is verified

[autotune_tmc stepper_x]
motor: omc-17hs19-2004s1

[tmc2209 stepper_x]
uart_pin: PC11
tx_pin: PC10
diag_pin: PC1
driver_SGTHRS: 110
uart_address: 2
interpolate: true
sense_resistor: 0.110
run_current: 1.13
hold_current: 0.50
stealthchop_threshold: 0

[autotune_tmc stepper_y]
motor: omc-17hs19-2004s1

[tmc2209 stepper_y]
uart_pin: PC11
tx_pin: PC10
diag_pin: PC0
driver_SGTHRS: 100
uart_address: 0
interpolate: true
sense_resistor: 0.110
run_current: 1.13
hold_current: 0.50
stealthchop_threshold: 0


[autotune_tmc stepper_z]
motor: creality-42-34
tuning_goal: auto  # default auto=silent

# Left Z motor as viewed from the front, SKR Z connector; observed by buzz.
[stepper_z]
step_pin: PB0
dir_pin: !PC5
enable_pin: !PB1
microsteps: 16
rotation_distance: 4
endstop_pin: probe:z_virtual_endstop
full_steps_per_rotation: 200
position_max: 400
position_min: -5
homing_speed: 10.0


# Right Z motor as viewed from the front, SKR E motor connector; observed by buzz.
# Inverted after first positive buzz raised the right bed edge.
[stepper_z1]
step_pin: PB3
dir_pin: !PB4
enable_pin: !PD1
microsteps: 16
rotation_distance: 4
full_steps_per_rotation: 200

[tmc2209 stepper_z1]
uart_pin: PC11
tx_pin: PC10
uart_address: 3
interpolate: true
sense_resistor: 0.110
run_current: 0.750
hold_current: 0.500
stealthchop_threshold: 0

[tmc2209 stepper_z]
uart_pin: PC11
tx_pin: PC10
uart_address: 1
interpolate: true
sense_resistor: 0.110
# run_current: 0.48
run_current: 0.750
hold_current: 0.500
stealthchop_threshold: 0
